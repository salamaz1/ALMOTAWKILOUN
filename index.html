<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="نظام استعلام سيارات المتوكلون لتجارة السيارات">
  <title>المتوكلون | استعلام السيارات</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <header class="site-header">
    <img class="main-logo" src="assets/logo.jpeg" alt="شعار المتوكلون لتجارة السيارات">
    <div class="header-copy">
      <p class="eyebrow">المتوكلون لتجارة السيارات</p>
      <h1>استعلام السيارات</h1>
      <p class="subtitle">ابحث عن السيارة واضغط على البطاقة لعرض التفاصيل</p>
    </div>
  </header>

  <main class="container">
    <section class="controls" aria-label="البحث والتصفية">
      <div class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="بحث بالنوع، الموديل أو رقم الهيكل..." autocomplete="off">
        <button id="clearSearch" type="button">مسح</button>
      </div>
      <div id="brandFilters" class="brand-filters" aria-label="تصفية حسب النوع"></div>
    </section>

    <div class="list-heading">
      <h2>السيارات</h2>
      <div id="counter" class="counter" aria-live="polite"></div>
    </div>

    <section id="cards" class="cards" aria-live="polite">
      <div class="loading">جاري تحميل البيانات...</div>
    </section>
  </main>

  <!-- تفاصيل البطاقة تظهر أسفلها مباشرة عند الضغط -->
  <!--
    <div class="modal-top">
      <div>
        <span class="modal-label">تفاصيل السيارة</span>
        <h2 id="modalTitle"></h2>
        <p id="modalVin"></p>
      </div>
      <button id="closeModal" class="close-modal" type="button" aria-label="إغلاق">×</button>
    </div>
    <div id="modalDetails" class="modal-details"></div>
  -->

  <script>
    /*
      بعد نشر ملف Google Sheets بصيغة CSV، ضع الرابط بين علامتي الاقتباس.
      مثال: https://docs.google.com/spreadsheets/d/e/XXXX/pub?output=csv
    */
    const SHEET_ID = "1CjU2nCdlrOCYhS651d0iTkH1GNOIHfbT";
    const SHEET_GID = "";

    /* بيانات ملف Excel الحالي، وتظهر تلقائيا إذا لم يوضع رابط Google Sheets. */
    const FALLBACK_DATA = [
      {"ت":"1","النوع":"هوندا","الموديل":"CRV","السنة":"2007","رقم الهيكل":"7c204048","تاريخ الشراء":"19/09/2026","شراء من":"مؤيد المجدوب","سعر الشراء":"36500","الحالة":"في المعرض","صيانة":"","غسيل":"","اعلان":"","نقل":"300","تكلفة اجمالية":"36800","تاريخ البيع":"","سعر البيع":"","الفرق":"-36800","ملاحظات":""},
      {"ت":"2","النوع":"هونداي","الموديل":"سوناتا","السنة":"2010","رقم الهيكل":"AA135197","تاريخ الشراء":"19/09/2026","شراء من":"مؤيد المجدوب","سعر الشراء":"32500","الحالة":"في المعرض","صيانة":"","غسيل":"","اعلان":"","نقل":"300","تكلفة اجمالية":"32800","تاريخ البيع":"","سعر البيع":"","الفرق":"-32800","ملاحظات":""},
      {"ت":"3","النوع":"كيا","الموديل":"PRIDE","السنة":"","رقم الهيكل":"","تاريخ الشراء":"19/09/2026","شراء من":"الصدارة","سعر الشراء":"33300","الحالة":"في الورشة","صيانة":"","غسيل":"","اعلان":"","نقل":"","تكلفة اجمالية":"33300","تاريخ البيع":"","سعر البيع":"","الفرق":"-33300","ملاحظات":""}
    ];

    const moneyFields = ["سعر الشراء", "صيانة", "غسيل", "اعلان", "نقل", "تكلفة اجمالية", "سعر البيع", "الفرق"];
    const cardsDiv = document.getElementById("cards");
    const searchInput = document.getElementById("search");
    const brandFiltersDiv = document.getElementById("brandFilters");
    const counterDiv = document.getElementById("counter");
    let allData = [];
    let currentBrand = "";

    function clean(value) {
      return value === null || value === undefined ? "" : String(value).trim();
    }

    function formatLYD(value) {
      const raw = clean(value);
      if (!raw || raw === "-") return "-";
      const number = Number(raw.replace(/[^0-9.-]/g, ""));
      if (!Number.isFinite(number)) return raw;
      return new Intl.NumberFormat("ar-LY").format(number) + " د.ل";
    }

    function normalizeColumnName(value) {
      return clean(value)
        .replace(/[\u064B-\u065F\u0670]/g, "")
        .replace(/[\u0622\u0623\u0625]/g, "\u0627")
        .replace(/[\uFEFF\s_-]/g, "");
    }

    function getTotalCostKey(car) {
      return Object.keys(car).find(key => {
        const normalized = normalizeColumnName(key);
        return normalized.includes("\u062a\u0643\u0644\u0641") &&
          (normalized.includes("\u0627\u062c\u0645\u0627\u0644") || normalized.includes("\u0627\u062c\u0645\u0627\u0644\u064a"));
      });
    }

    function normalizeData(rows) {
      return rows.filter(row => clean(row["النوع"]) || clean(row["الموديل"]) || clean(row["رقم الهيكل"]));
    }

    function loadGoogleSheet() {
      return new Promise((resolve, reject) => {
        const callbackName = "googleSheetCallback_" + Date.now();
        const script = document.createElement("script");
        const queryUrl = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
          "/gviz/tq?headers=1" +
          (SHEET_GID ? "&gid=" + encodeURIComponent(SHEET_GID) : "") +
          "&tqx=responseHandler:" + callbackName;

        const cleanup = () => {
          delete window[callbackName];
          script.remove();
        };

        window[callbackName] = response => {
          try {
            if (!response || response.status !== "ok" || !response.table) {
              throw new Error("Google Sheets لم يرجع بيانات صالحة");
            }
            const columns = response.table.cols.map((column, index) =>
              column.label || column.id || ("Column " + (index + 1))
            );
            const rows = response.table.rows.map(row => {
              const values = (row.c || []).map(cell => cell ? (cell.v ?? "") : "");
              return Object.fromEntries(columns.map((column, index) => [column, values[index] ?? ""]));
            });
            cleanup();
            resolve(rows);
          } catch (error) {
            cleanup();
            reject(error);
          }
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("تعذر الوصول إلى Google Sheets"));
        };
        script.src = queryUrl;
        document.head.appendChild(script);
      });
    }

    function loadData() {
      loadGoogleSheet().then(useData).catch(() => {
        cardsDiv.innerHTML = '<div class="state error">تعذر تحميل الجدول. افتح مشاركة Google Sheets واجعل الوصول: أي شخص لديه الرابط، ثم اختر مشاهد وأعد تحميل الصفحة.</div>';
      });
    }

    function useData(rows) {
      allData = normalizeData(rows);
      allData.forEach(car => {
        const totalCostKey = getTotalCostKey(car);
        if (totalCostKey) car["\u0627\u0644\u062a\u0643\u0644\u0641\u0629 \u0627\u0644\u0625\u062c\u0645\u0627\u0644\u064a\u0629"] = car[totalCostKey];
      });
      buildBrandFilters();
      applyFilters();
    }

    function buildBrandFilters() {
      const brands = [...new Set(allData.map(car => clean(car["النوع"])).filter(Boolean))];
      brandFiltersDiv.innerHTML = `<button class="active" data-brand="">الكل</button>` +
        brands.map(brand => `<button data-brand="${escapeHtml(brand)}">${escapeHtml(brand)}</button>`).join("");

      brandFiltersDiv.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          brandFiltersDiv.querySelectorAll("button").forEach(item => item.classList.remove("active"));
          button.classList.add("active");
          currentBrand = button.dataset.brand;
          applyFilters();
        });
      });
    }

    function applyFilters() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = allData.filter(car => {
        const matchesText = Object.values(car).join(" ").toLowerCase().includes(query);
        const matchesBrand = !currentBrand || clean(car["النوع"]) === currentBrand;
        return matchesText && matchesBrand;
      });
      render(filtered);
    }

    function render(data) {
      counterDiv.textContent = `عدد السيارات: ${data.length}`;
      if (!data.length) {
        cardsDiv.innerHTML = '<div class="state">لا توجد نتائج مطابقة.</div>';
        return;
      }
      cardsDiv.innerHTML = data.map((car, index) => {
        const brand = escapeHtml(clean(car["النوع"]) || "غير محدد");
        const model = escapeHtml(clean(car["الموديل"]) || "بدون موديل");
        const status = escapeHtml(clean(car["الحالة"]) || "غير محددة");
        const totalCost = escapeHtml(formatLYD(car["التكلفة الإجمالية"]));
        return `
          <article class="car-card" data-index="${allData.indexOf(car)}">
            <button class="card-trigger" type="button" aria-expanded="false">
            <div class="card-copy">
              <div class="card-title"><span class="brand">${brand}</span><h3>${model}</h3></div>
              <div class="summary"><span><small>التكلفة</small><strong>${totalCost}</strong></span><span><small>الحالة</small><strong class="status">${status}</strong></span></div>
            </div>
            <span class="view-details">عرض التفاصيل</span>
            </button>
            <div class="card-details" aria-hidden="true"></div>
          </article>`;
      }).join("");

      cardsDiv.querySelectorAll(".card-trigger").forEach(trigger => {
        trigger.addEventListener("click", () => toggleCar(trigger.closest(".car-card")));
      });
    }

    function toggleCar(card) {
      const trigger = card.querySelector(".card-trigger");
      const details = card.querySelector(".card-details");
      const isOpen = card.classList.toggle("is-open");
      trigger.setAttribute("aria-expanded", String(isOpen));
      details.setAttribute("aria-hidden", String(!isOpen));
      if (!isOpen) return;

      const car = allData[Number(card.dataset.index)];
      details.innerHTML = Object.entries(car).map(([key, value]) => {
        const shown = moneyFields.includes(key) ? formatLYD(value) : (clean(value) || "-");
        return `<div class="detail-row"><span>${escapeHtml(key)}</span><strong>${escapeHtml(shown)}</strong></div>`;
      }).join("");
    }

    function openCar(car) {
      document.getElementById("modalTitle").textContent = `${clean(car["النوع"]) || "سيارة"} ${clean(car["الموديل"])}`;
      document.getElementById("modalVin").textContent = `رقم الهيكل: ${clean(car["رقم الهيكل"]) || "-"}`;
      modalDetails.innerHTML = Object.entries(car).map(([key, value]) => {
        const shown = moneyFields.includes(key) ? formatLYD(value) : (clean(value) || "-");
        return `<div class="detail-row"><span>${escapeHtml(key)}</span><strong>${escapeHtml(shown)}</strong></div>`;
      }).join("");
      modal.showModal();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[char]);
    }

    searchInput.addEventListener("input", applyFilters);
    document.getElementById("clearSearch").addEventListener("click", () => {
      searchInput.value = "";
      searchInput.focus();
      applyFilters();
    });
    loadData();
  </script>
</body>
</html>
